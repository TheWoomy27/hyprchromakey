monitor = , 1280x720@60, 0x0, 1

ecosystem {
    no_donation_nag = true
    no_update_news = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # a loud green behind everything, so anything keyed out is unmistakable
    background_color = rgb(00ff00)
    disable_autoreload = true
}

animations {
    enabled = false
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

general {
    border_size = 2
    gaps_in = 0
    gaps_out = 0
    col.active_border = rgb(ff0000)
}

plugin = PLUGIN_PATH

plugin {
    hyprchromakey {
        enabled = true
        similarity = 0.06
        smoothness = 0.02
    }
}

# kitty's background in the test session
chromakey = rgb(1e1e2e)
chromakey = profile alt, color rgb(ff8800), similarity 0.2, opacity 0.5

windowrule = plugin:chromakey 1, match:class ^(kitty)$

exec-once = LAUNCHER
